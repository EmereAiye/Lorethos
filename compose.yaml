services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lorethos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lorethos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lorethos}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lorethos} -d ${POSTGRES_DB:-lorethos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lorethos}:${POSTGRES_PASSWORD:-lorethos_dev_password}@postgres:5432/${POSTGRES_DB:-lorethos}
      SESSION_SECRET: ${SESSION_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:-Emmymasterwise@gmail.com}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    ports:
      - "8080:80"
      - "8443:443"

volumes:
  pgdata:
